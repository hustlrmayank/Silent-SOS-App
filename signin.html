<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Silent SOS</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <h1>Silent SOS</h1>
            <div class="auth-card">
                <div id="signin-section">
                    <h2>Sign In</h2>
                    <p>Sign in to access your emergency contacts and settings</p>
                    <button id="googleSignIn" class="google-btn">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
                        Sign in with Google
                    </button>
                </div>
                <div id="profile-section" style="display: none;">
                    <div class="profile-header">
                        <img id="profile-picture" src="" alt="Profile Picture" class="profile-picture">
                        <h2 id="user-name"></h2>
                        <p id="user-email"></p>
                    </div>
                    <div class="profile-actions">
                        <button id="signout" class="signout-btn">Sign Out</button>
                    </div>
                </div>
                <div id="error-message" class="error-message"></div>
            </div>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
